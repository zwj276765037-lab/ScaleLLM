<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #263238; stroke-width: 3; }
      .recover { fill: #d9eafb; stroke: #24527a; stroke-width: 3; }
      .control { fill: #fff2cc; stroke: #8a6d1d; stroke-width: 3; }
      .partial { fill: #f8d7da; stroke: #8d3942; stroke-width: 3; }
      .accum { fill: #cfeaf3; stroke: #266276; stroke-width: 3; }
      .finalize { fill: #fff0d9; stroke: #8a5a16; stroke-width: 3; }
      .tensor { fill: #e8d9f4; stroke: #684083; stroke-width: 3; }
      .nonlinear { fill: #dcefdc; stroke: #3f6f44; stroke-width: 3; }
      .cache { fill: #d6edf5; stroke: #39738a; stroke-width: 3; }
      .output { fill: #f3c7cc; stroke: #8d3942; stroke-width: 3; }
      .note { fill: #f1f3f5; stroke: #65727c; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .arrow { fill: none; stroke: #263238; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #266276; stroke-width: 4; marker-end: url(#arrowBlue); }
      .arrow-purple { fill: none; stroke: #684083; stroke-width: 4; marker-end: url(#arrowPurple); }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 40px; font-weight: 700; fill: #18222a; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #52616b; }
      .section { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 26px; font-weight: 700; fill: #263238; }
      .box-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 700; fill: #20292f; }
      .box-main { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 600; fill: #20292f; }
      .box-small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #3e4a52; }
      .tiny { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #52616b; }
      .phase { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#266276"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#684083"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1180"/>
  <text class="title" x="960" y="58" text-anchor="middle">MLP 反量化后的 Group 累加与后处理</text>
  <text class="subtitle" x="960" y="91" text-anchor="middle">当前 V3 RTL 快照：共享 A8W4 Kernel 输出之后的数据通路</text>

  <!-- Shared dequantization output -->
  <rect class="recover" x="55" y="155" width="330" height="300" rx="20"/>
  <text class="box-title" x="220" y="198" text-anchor="middle">ScaleCode 尺度恢复</text>
  <text class="box-small" x="220" y="238" text-anchor="middle">dot S17 × activation_code U8</text>
  <text class="box-small" x="220" y="265" text-anchor="middle">× weight_code U8</text>
  <text class="box-main" x="220" y="307" text-anchor="middle">raw S33</text>
  <path d="M100 330 H340" stroke="#72818b" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="box-small" x="220" y="363" text-anchor="middle">按 total_shift 对齐到 Q*.24</text>
  <text class="box-main" x="220" y="402" text-anchor="middle">Group Partial</text>
  <text class="box-main" x="220" y="432" text-anchor="middle">S37 Q13.24</text>

  <!-- Tag path -->
  <rect class="control" x="430" y="120" width="355" height="116" rx="18"/>
  <text class="box-title" x="607" y="157" text-anchor="middle">流水线 Tag FIFO</text>
  <text class="box-small" x="607" y="188" text-anchor="middle">mode · first · last · tile</text>
  <text class="tiny" x="607" y="216" text-anchor="middle">与 S37 partial 同步延迟后再分流</text>

  <path class="arrow" marker-end="url(#arrow)" d="M385 305 H558"/>
  <polygon class="control" points="570,305 660,245 750,305 660,365"/>
  <text class="box-title" x="660" y="297" text-anchor="middle">mode</text>
  <text class="box-small" x="660" y="325" text-anchor="middle">DEMUX</text>
  <path class="arrow" marker-end="url(#arrow)" d="M607 236 V245 H640"/>

  <!-- Main two phase panels -->
  <rect class="panel" x="790" y="125" width="1075" height="480" rx="24"/>
  <rect x="815" y="145" width="210" height="42" rx="21" fill="#527c8e"/>
  <text class="phase" x="920" y="173" text-anchor="middle">Gate / Up 路径</text>
  <text class="section" x="1080" y="174">128 个 group32，Gate 与 Up 分别执行一遍</text>

  <path class="arrow-blue" marker-end="url(#arrowBlue)" d="M730 276 C760 276 762 260 805 260"/>
  <text class="box-small" x="755" y="245" text-anchor="middle">in_down=0</text>

  <rect class="accum" x="820" y="215" width="250" height="185" rx="18"/>
  <text class="box-title" x="945" y="255" text-anchor="middle">Gate/Up 共享累加器</text>
  <text class="box-main" x="945" y="298" text-anchor="middle">S44 Q20.24</text>
  <text class="box-small" x="945" y="330" text-anchor="middle">128 × S37 partial</text>
  <text class="box-small" x="945" y="360" text-anchor="middle">Gate结束后清空，再用于Up</text>
  <text class="tiny" x="945" y="386" text-anchor="middle">同一物理累加阵列，不同时计算</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1070 307 H1110"/>
  <rect class="finalize" x="1110" y="215" width="220" height="185" rx="18"/>
  <text class="box-title" x="1220" y="255" text-anchor="middle">最后一组 Finalize</text>
  <text class="box-main" x="1220" y="294" text-anchor="middle">右移 8 bit</text>
  <text class="box-small" x="1220" y="327" text-anchor="middle">half away from zero</text>
  <text class="box-small" x="1220" y="357" text-anchor="middle">饱和到 S24</text>
  <text class="tiny" x="1220" y="385" text-anchor="middle">中途不逐 group 舍入</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1330 307 H1370"/>
  <rect class="tensor" x="1370" y="230" width="205" height="155" rx="18"/>
  <text class="box-title" x="1472" y="269" text-anchor="middle">Gate / Up 投影</text>
  <text class="box-main" x="1472" y="310" text-anchor="middle">S24 Q8.16</text>
  <text class="box-small" x="1472" y="341" text-anchor="middle">12-column tile</text>
  <text class="tiny" x="1472" y="369" text-anchor="middle">两次结果由 phase tag 区分</text>

  <path class="arrow-purple" marker-end="url(#arrowPurple)" d="M1575 307 H1612"/>
  <rect class="nonlinear" x="1612" y="205" width="220" height="205" rx="18"/>
  <text class="box-title" x="1722" y="245" text-anchor="middle">重排与 SwiGLU</text>
  <text class="box-small" x="1722" y="278" text-anchor="middle">12 → 16 Repack</text>
  <text class="box-small" x="1722" y="311" text-anchor="middle">配对 Gate / Up</text>
  <text class="box-main" x="1722" y="346" text-anchor="middle">SiLU(Gate) × Up</text>
  <text class="box-main" x="1722" y="379" text-anchor="middle">S32 Q16.16</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1722 410 V438"/>
  <rect class="nonlinear" x="1230" y="438" width="602" height="132" rx="18"/>
  <text class="box-title" x="1531" y="475" text-anchor="middle">Down Activation 重新量化</text>
  <text class="box-small" x="1531" y="508" text-anchor="middle">Normalized Hadamard32 → S35 Q19.16</text>
  <text class="box-small" x="1531" y="539" text-anchor="middle">min/max 在线 A8（无预裁剪）→ U8 data + U24 metadata</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1205 504 H1167"/>
  <rect class="cache" x="855" y="443" width="312" height="122" rx="18"/>
  <text class="box-title" x="1011" y="482" text-anchor="middle">Down Activation Cache</text>
  <text class="box-main" x="1011" y="520" text-anchor="middle">448 个 group32</text>
  <text class="box-small" x="1011" y="548" text-anchor="middle">随后按 group-major 回放</text>

  <!-- Down panel -->
  <rect class="panel" x="405" y="645" width="1460" height="395" rx="24"/>
  <rect x="430" y="665" width="175" height="42" rx="21" fill="#527c8e"/>
  <text class="phase" x="517" y="693" text-anchor="middle">Down 路径</text>
  <text class="section" x="635" y="694">448 个 group32，按输出 tile 地址保留部分和</text>

  <!-- Feedback from cache to kernel/dequant, represented as phase transition -->
  <path class="arrow-blue" marker-end="url(#arrowBlue)" d="M855 525 H780 V605 H224 V615"/>
  <rect class="note" x="72" y="625" width="305" height="100" rx="16"/>
  <text class="box-title" x="224" y="662" text-anchor="middle">进入 Down Phase</text>
  <text class="box-small" x="224" y="694" text-anchor="middle">Z cache + W_down 再次经过</text>
  <text class="box-small" x="224" y="718" text-anchor="middle">同一个 Kernel 与尺度恢复单元</text>

  <path class="arrow-blue" marker-end="url(#arrowBlue)" d="M660 365 V615 H395 V825 H420"/>
  <text class="box-small" x="430" y="734">in_down=1</text>

  <rect class="partial" x="430" y="745" width="205" height="160" rx="18"/>
  <text class="box-title" x="532" y="786" text-anchor="middle">Down Group Partial</text>
  <text class="box-main" x="532" y="829" text-anchor="middle">S37 Q13.24</text>
  <text class="box-small" x="532" y="865" text-anchor="middle">每次一个 group32</text>
  <text class="tiny" x="532" y="892" text-anchor="middle">来自同一尺度恢复输出</text>

  <path class="arrow" marker-end="url(#arrow)" d="M635 825 H680"/>
  <rect class="accum" x="680" y="735" width="285" height="180" rx="18"/>
  <text class="box-title" x="822" y="777" text-anchor="middle">Down BRAM Accumulator</text>
  <text class="box-main" x="822" y="818" text-anchor="middle">S46 Q22.24</text>
  <text class="box-small" x="822" y="851" text-anchor="middle">448 × S37 partial</text>
  <text class="box-small" x="822" y="880" text-anchor="middle">每个 output tile 独立地址</text>
  <text class="tiny" x="822" y="905" text-anchor="middle">first_group覆盖旧值，last_group触发输出</text>

  <path class="arrow" marker-end="url(#arrow)" d="M965 825 H1005"/>
  <rect class="finalize" x="1005" y="745" width="220" height="160" rx="18"/>
  <text class="box-title" x="1115" y="785" text-anchor="middle">最后一组 Finalize</text>
  <text class="box-main" x="1115" y="825" text-anchor="middle">右移 8 bit</text>
  <text class="box-small" x="1115" y="856" text-anchor="middle">舍入并饱和到 S24</text>
  <text class="tiny" x="1115" y="886" text-anchor="middle">仅在448组全部完成后执行</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1225 825 H1265"/>
  <rect class="tensor" x="1265" y="755" width="190" height="140" rx="18"/>
  <text class="box-title" x="1360" y="795" text-anchor="middle">Down Projection</text>
  <text class="box-main" x="1360" y="835" text-anchor="middle">S24 Q8.16</text>
  <text class="box-small" x="1360" y="868" text-anchor="middle">12-column tile</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1455 825 H1495"/>
  <rect class="finalize" x="1495" y="755" width="145" height="140" rx="18"/>
  <text class="box-title" x="1567" y="804" text-anchor="middle">12 → 16</text>
  <text class="box-main" x="1567" y="844" text-anchor="middle">Repack</text>
  <text class="box-small" x="1567" y="875" text-anchor="middle">恢复逻辑列序</text>

  <path class="arrow" marker-end="url(#arrow)" d="M1640 825 H1680"/>
  <rect class="output" x="1680" y="735" width="160" height="180" rx="18"/>
  <text class="box-title" x="1760" y="777" text-anchor="middle">最终 MLP 输出</text>
  <text class="box-main" x="1760" y="819" text-anchor="middle">16 × 4096</text>
  <text class="box-main" x="1760" y="854" text-anchor="middle">S24 Q8.16</text>
  <text class="box-small" x="1760" y="887" text-anchor="middle">当前V3接口</text>

  <!-- Footer notes -->
  <rect class="note" x="75" y="1080" width="1770" height="70" rx="18"/>
  <text class="box-main" x="960" y="1110" text-anchor="middle">关键：共享的是 A8W4 Kernel 与尺度恢复；Gate/Up 累加器和 Down BRAM 累加器是两套不同硬件。</text>
  <text class="box-small" x="960" y="1138" text-anchor="middle">S37 / S44 / S46 / S24 为当前 V3 RTL 快照，硬件位宽冻结后需再次核对。</text>
</svg>
