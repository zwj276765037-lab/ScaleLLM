<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <style>
      .title { font: 700 42px "DejaVu Sans", sans-serif; fill: #111; }
      .subtitle { font: 21px "DejaVu Sans", sans-serif; fill: #444; }
      .head { font: 700 27px "DejaVu Sans", sans-serif; fill: #111; }
      .label { font: 700 22px "DejaVu Sans", sans-serif; fill: #111; }
      .text { font: 19px "DejaVu Sans", sans-serif; fill: #111; }
      .small { font: 16px "DejaVu Sans", sans-serif; fill: #444; }
      .box { stroke: #111; stroke-width: 4; }
      .wire { fill: none; stroke: #111; stroke-width: 5; }
      .feedback { fill: none; stroke: #176f82; stroke-width: 5; }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" class="title">Compact MLP Post-Scale Architecture — Current V3 RTL</text>
  <text x="900" y="91" text-anchor="middle" class="subtitle">One external backend module; internal details are hidden behind two phase-selected paths</text>

  <rect x="40" y="120" width="1720" height="710" rx="32" fill="#fff0cf" class="box"/>

  <!-- Shared compute source -->
  <rect x="90" y="275" width="280" height="310" rx="24" fill="#45a3b5" class="box"/>
  <rect x="125" y="300" width="210" height="42" rx="18" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="230" y="328" text-anchor="middle" class="small">ONE PHYSICAL BLOCK</text>
  <text x="230" y="390" text-anchor="middle" class="head">Shared SC-M-PE</text>
  <text x="230" y="433" text-anchor="middle" class="text">A8W4 group32</text>
  <text x="230" y="470" text-anchor="middle" class="text">Gate / Up / Down</text>
  <line x1="125" y1="500" x2="335" y2="500" stroke="#555" stroke-width="3" stroke-dasharray="11 9"/>
  <text x="230" y="535" text-anchor="middle" class="label">S37 Q13.24</text>
  <text x="230" y="562" text-anchor="middle" class="small">group partial stream</text>

  <!-- Main input arrow -->
  <line x1="370" y1="430" x2="452" y2="430" class="wire"/>
  <polygon points="452,430 432,419 432,441" fill="#111"/>

  <!-- Unified backend wrapper -->
  <rect x="470" y="175" width="860" height="520" rx="27" fill="#edf7f8" class="box"/>
  <rect x="470" y="175" width="860" height="78" rx="25" fill="#2f8799" stroke="#111" stroke-width="4"/>
  <rect x="470" y="220" width="860" height="33" fill="#2f8799"/>
  <text x="900" y="226" text-anchor="middle" class="head" fill="#ffffff">MLP POST-SCALE BACKEND</text>

  <!-- Gate/Up collapsed path -->
  <rect x="520" y="285" width="760" height="155" rx="22" fill="#cee7d4" class="box"/>
  <text x="555" y="323" class="label">GATE / UP PHASE</text>
  <text x="555" y="360" class="text">S37 partial → S44 accumulate (128 groups) → finalize S24</text>
  <text x="555" y="395" class="text">12-to-16 repack → SwiGLU → normalized H32 → online A8</text>
  <rect x="1112" y="308" width="135" height="42" rx="18" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="1179" y="336" text-anchor="middle" class="small">U8 + U24</text>

  <!-- Down collapsed path -->
  <rect x="520" y="485" width="760" height="155" rx="22" fill="#a9d8e7" class="box"/>
  <text x="555" y="523" class="label">DOWN PHASE</text>
  <text x="555" y="560" class="text">S37 partial → S46 BRAM accumulate (448 groups) → finalize S24</text>
  <text x="555" y="595" class="text">12-to-16 repack → final 16 × 4096 projection</text>
  <rect x="1100" y="508" width="147" height="42" rx="18" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="1173" y="536" text-anchor="middle" class="small">S24 Q8.16</text>

  <text x="900" y="674" text-anchor="middle" class="small">phase, first_group, last_group and tile_index select the internal path</text>

  <!-- Output cache -->
  <line x1="1280" y1="363" x2="1402" y2="363" class="wire"/>
  <polygon points="1402,363 1382,352 1382,374" fill="#111"/>
  <rect x="1420" y="275" width="290" height="178" rx="22" fill="#a9d8e7" class="box"/>
  <text x="1565" y="319" text-anchor="middle" class="label">Down Activation Cache</text>
  <text x="1565" y="359" text-anchor="middle" class="text">448 group32</text>
  <text x="1565" y="397" text-anchor="middle" class="label">U8 + U24 metadata</text>
  <text x="1565" y="427" text-anchor="middle" class="small">feeds the next Down phase</text>

  <!-- Final output -->
  <line x1="1280" y1="563" x2="1402" y2="563" class="wire"/>
  <polygon points="1402,563 1382,552 1382,574" fill="#111"/>
  <rect x="1420" y="500" width="290" height="160" rx="22" fill="#df9da3" class="box"/>
  <text x="1565" y="545" text-anchor="middle" class="label">Final MLP Output</text>
  <text x="1565" y="586" text-anchor="middle" class="label">16 × 4096</text>
  <text x="1565" y="625" text-anchor="middle" class="label">S24 Q8.16</text>

  <!-- Feedback loop -->
  <path d="M1565 275 V160 H230 V257" class="feedback"/>
  <polygon points="230,272 219,252 241,252" fill="#176f82"/>
  <rect x="665" y="137" width="570" height="45" rx="20" fill="#ffffff" stroke="#176f82" stroke-width="3"/>
  <text x="950" y="167" text-anchor="middle" class="small">Down cache replay + Down W4/ScaleCode reuse the same SC-M-PE</text>

  <!-- External interface summary -->
  <rect x="125" y="735" width="1550" height="66" rx="22" fill="#fff8eb" class="box"/>
  <text x="900" y="777" text-anchor="middle" class="text">Externally this is one backend module. Internally Gate/Up and Down keep independent accumulator storage.</text>
</svg>
