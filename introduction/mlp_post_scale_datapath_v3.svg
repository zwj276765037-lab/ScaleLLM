<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1250" viewBox="0 0 2400 1250">
  <defs>
    <style>
      .title { font: 700 38px "DejaVu Sans", sans-serif; fill: #111; }
      .subtitle { font: 22px "DejaVu Sans", sans-serif; fill: #333; }
      .band-title { font: 700 25px "DejaVu Sans", sans-serif; fill: #111; }
      .block-title { font: 700 23px "DejaVu Sans", sans-serif; fill: #111; }
      .block-sub { font: 19px "DejaVu Sans", sans-serif; fill: #111; }
      .small { font: 17px "DejaVu Sans", sans-serif; fill: #333; }
      .tiny { font: 15px "DejaVu Sans", sans-serif; fill: #444; }
      .box { stroke: #111; stroke-width: 4; }
      .arrow { fill: none; stroke: #111; stroke-width: 5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #18687b; stroke-width: 5; marker-end: url(#arrow-teal); }
      .dash { fill: none; stroke: #666; stroke-width: 3; stroke-dasharray: 13 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18687b"/>
    </marker>
  </defs>

  <rect width="2400" height="1250" fill="#ffffff"/>
  <text x="1200" y="58" text-anchor="middle" class="title">SC-M-PE Post-Scale Datapath — Current V3 RTL</text>
  <text x="1200" y="94" text-anchor="middle" class="subtitle">Continuation after ScaleCode recovery and Q24 alignment</text>

  <rect x="45" y="125" width="2310" height="1065" rx="34" fill="#fff0cf" class="box"/>

  <!-- Shared input and phase routing -->
  <rect x="80" y="185" width="235" height="145" rx="15" fill="#df9da3" class="box"/>
  <text x="197" y="224" text-anchor="middle" class="block-title">Group Partial</text>
  <text x="197" y="258" text-anchor="middle" class="block-title">S37 Q13.24</text>
  <text x="197" y="292" text-anchor="middle" class="small">one row × one column</text>
  <text x="197" y="316" text-anchor="middle" class="tiny">no per-group rounding</text>

  <path d="M315 257 H365" class="arrow"/>
  <rect x="365" y="190" width="200" height="135" rx="15" fill="#42a2b4" class="box"/>
  <text x="465" y="229" text-anchor="middle" class="block-title">Phase Router</text>
  <text x="465" y="266" text-anchor="middle" class="block-sub">Gate / Up</text>
  <text x="465" y="296" text-anchor="middle" class="block-sub">or Down</text>

  <!-- Gate / Up band -->
  <text x="615" y="163" class="band-title">1  Gate / Up Projection and SwiGLU Requantization</text>
  <path d="M565 226 H610" class="arrow"/>

  <rect x="610" y="175" width="255" height="165" rx="18" fill="#a9d8e7" class="box"/>
  <text x="737" y="214" text-anchor="middle" class="block-title">Gate / Up Accumulator</text>
  <text x="737" y="251" text-anchor="middle" class="block-sub">128 group partials</text>
  <text x="737" y="286" text-anchor="middle" class="block-title">S44 Q20.24</text>
  <text x="737" y="318" text-anchor="middle" class="tiny">first overwrites; others add</text>

  <path d="M865 257 H910" class="arrow"/>
  <rect x="910" y="175" width="230" height="165" rx="18" fill="#fff4df" class="box"/>
  <text x="1025" y="214" text-anchor="middle" class="block-title">Finalize</text>
  <text x="1025" y="250" text-anchor="middle" class="block-sub">round ± away from 0</text>
  <text x="1025" y="280" text-anchor="middle" class="block-sub">arithmetic shift ÷ 2⁸</text>
  <text x="1025" y="312" text-anchor="middle" class="small">saturate to S24</text>

  <path d="M1140 257 H1185" class="arrow"/>
  <rect x="1185" y="185" width="205" height="145" rx="15" fill="#df9da3" class="box"/>
  <text x="1287" y="224" text-anchor="middle" class="block-title">Gate / Up</text>
  <text x="1287" y="256" text-anchor="middle" class="block-title">Projection</text>
  <text x="1287" y="292" text-anchor="middle" class="block-sub">S24 Q8.16</text>
  <text x="1287" y="316" text-anchor="middle" class="tiny">physical 12 columns</text>

  <path d="M1390 257 H1435" class="arrow"/>
  <rect x="1435" y="190" width="190" height="135" rx="15" fill="#fff4df" class="box"/>
  <text x="1530" y="232" text-anchor="middle" class="block-title">12-to-16</text>
  <text x="1530" y="265" text-anchor="middle" class="block-title">Repack</text>
  <text x="1530" y="296" text-anchor="middle" class="tiny">register / wiring only</text>

  <path d="M1625 257 H1670" class="arrow"/>
  <rect x="1670" y="175" width="275" height="165" rx="18" fill="#cfe7d5" class="box"/>
  <text x="1807" y="211" text-anchor="middle" class="block-title">SwiGLU</text>
  <text x="1807" y="246" text-anchor="middle" class="block-sub">SiLU LUT(Gate) × Up</text>
  <text x="1807" y="279" text-anchor="middle" class="small">S48 Q16.32 → round ÷ 2¹⁶</text>
  <text x="1807" y="312" text-anchor="middle" class="block-title">S32 Q16.16</text>

  <path d="M1945 257 H1990" class="arrow"/>
  <rect x="1990" y="175" width="285" height="165" rx="18" fill="#cfe7d5" class="box"/>
  <text x="2132" y="210" text-anchor="middle" class="block-title">Normalized Hadamard32</text>
  <text x="2132" y="245" text-anchor="middle" class="small">5 butterfly stages: S32 → S37</text>
  <text x="2132" y="276" text-anchor="middle" class="small">× 11585, round ÷ 2¹⁶</text>
  <text x="2132" y="312" text-anchor="middle" class="block-title">S35 Q19.16</text>

  <!-- Quantization and cache row -->
  <path d="M2132 340 V393" class="arrow"/>
  <rect x="1900" y="393" width="375" height="190" rx="18" fill="#cfe7d5" class="box"/>
  <text x="2087" y="432" text-anchor="middle" class="block-title">Online A8 Quantization</text>
  <text x="2087" y="468" text-anchor="middle" class="block-sub">low = min(0, x[0:31])</text>
  <text x="2087" y="499" text-anchor="middle" class="block-sub">high = max(0, x[0:31])</text>
  <text x="2087" y="530" text-anchor="middle" class="small">RNE U8 + zero-point + ScaleCode</text>
  <text x="2087" y="559" text-anchor="middle" class="tiny">no pre-clip</text>

  <path d="M1900 488 H1838" class="arrow"/>
  <rect x="1535" y="405" width="303" height="165" rx="18" fill="#a9d8e7" class="box"/>
  <text x="1686" y="447" text-anchor="middle" class="block-title">Down Activation Cache</text>
  <text x="1686" y="486" text-anchor="middle" class="block-sub">448 group32 activations</text>
  <text x="1686" y="522" text-anchor="middle" class="block-title">U8 data + U24 metadata</text>
  <text x="1686" y="549" text-anchor="middle" class="tiny">one metadata word per row/group</text>

  <path d="M80 635 H2315" class="dash"/>
  <text x="105" y="674" class="band-title">2  Down Projection — same physical SC-M-PE is reused</text>

  <!-- Feedback from cache to the down-phase shared kernel -->
  <path d="M1686 570 V620 H250 V735 H345" class="feedback"/>
  <rect x="80" y="593" width="500" height="48" rx="22" fill="#ffffff" stroke="#18687b" stroke-width="3"/>
  <text x="330" y="625" text-anchor="middle" class="small">replay U8/U24 + stream Down W4/ScaleCode</text>

  <!-- Down path -->
  <rect x="345" y="705" width="270" height="165" rx="18" fill="#42a2b4" class="box"/>
  <text x="480" y="744" text-anchor="middle" class="block-title">Shared SC-M-PE</text>
  <text x="480" y="780" text-anchor="middle" class="block-title">Down Phase</text>
  <text x="480" y="815" text-anchor="middle" class="small">same A8W4 dot + ScaleCode</text>
  <text x="480" y="843" text-anchor="middle" class="tiny">not another compute array</text>

  <path d="M615 787 H660" class="arrow"/>
  <rect x="660" y="715" width="220" height="145" rx="15" fill="#df9da3" class="box"/>
  <text x="770" y="754" text-anchor="middle" class="block-title">Down Group Partial</text>
  <text x="770" y="792" text-anchor="middle" class="block-title">S37 Q13.24</text>
  <text x="770" y="827" text-anchor="middle" class="small">one group32</text>

  <path d="M880 787 H925" class="arrow"/>
  <rect x="925" y="695" width="310" height="185" rx="18" fill="#a9d8e7" class="box"/>
  <text x="1080" y="735" text-anchor="middle" class="block-title">Down BRAM Accumulator</text>
  <text x="1080" y="773" text-anchor="middle" class="block-sub">448 group partials</text>
  <text x="1080" y="807" text-anchor="middle" class="block-title">S46 Q22.24</text>
  <text x="1080" y="839" text-anchor="middle" class="small">342 physical 12-col tiles</text>
  <text x="1080" y="865" text-anchor="middle" class="tiny">read-modify-write by tile index</text>

  <path d="M1235 787 H1280" class="arrow"/>
  <rect x="1280" y="705" width="230" height="165" rx="18" fill="#fff4df" class="box"/>
  <text x="1395" y="744" text-anchor="middle" class="block-title">Finalize</text>
  <text x="1395" y="780" text-anchor="middle" class="block-sub">round ± away from 0</text>
  <text x="1395" y="810" text-anchor="middle" class="block-sub">arithmetic shift ÷ 2⁸</text>
  <text x="1395" y="842" text-anchor="middle" class="small">saturate to S24</text>

  <path d="M1510 787 H1555" class="arrow"/>
  <rect x="1555" y="715" width="220" height="145" rx="15" fill="#df9da3" class="box"/>
  <text x="1665" y="754" text-anchor="middle" class="block-title">Down Projection</text>
  <text x="1665" y="792" text-anchor="middle" class="block-title">S24 Q8.16</text>
  <text x="1665" y="827" text-anchor="middle" class="small">physical 12 columns</text>

  <path d="M1775 787 H1820" class="arrow"/>
  <rect x="1820" y="720" width="190" height="135" rx="15" fill="#fff4df" class="box"/>
  <text x="1915" y="762" text-anchor="middle" class="block-title">12-to-16</text>
  <text x="1915" y="795" text-anchor="middle" class="block-title">Repack</text>
  <text x="1915" y="826" text-anchor="middle" class="tiny">discard invalid tail lanes</text>

  <path d="M2010 787 H2055" class="arrow"/>
  <rect x="2055" y="705" width="260" height="165" rx="18" fill="#df9da3" class="box"/>
  <text x="2185" y="745" text-anchor="middle" class="block-title">Final MLP Output</text>
  <text x="2185" y="785" text-anchor="middle" class="block-title">16 × 4096</text>
  <text x="2185" y="823" text-anchor="middle" class="block-title">S24 Q8.16</text>
  <text x="2185" y="850" text-anchor="middle" class="tiny">residual add is outside this core</text>

  <!-- Design rules / legend -->
  <rect x="120" y="960" width="2160" height="175" rx="24" fill="#fff7e9" class="box"/>
  <text x="1200" y="1003" text-anchor="middle" class="block-title">Datapath Rules</text>
  <text x="180" y="1045" class="block-sub">① Scale alignment: arithmetic shift to Q24; no rounding at the group boundary.</text>
  <text x="180" y="1082" class="block-sub">② Accumulation: preserve Q24; no per-group saturation. Finalize only after the last group.</text>
  <text x="180" y="1119" class="block-sub">③ Repack changes column order only. Gate/Up feeds SwiGLU; Down S24 is the final MLP projection.</text>

  <!-- Color legend -->
  <rect x="120" y="1160" width="34" height="20" fill="#42a2b4" stroke="#111" stroke-width="2"/>
  <text x="165" y="1178" class="tiny">shared compute / routing</text>
  <rect x="420" y="1160" width="34" height="20" fill="#a9d8e7" stroke="#111" stroke-width="2"/>
  <text x="465" y="1178" class="tiny">state / accumulation / cache</text>
  <rect x="790" y="1160" width="34" height="20" fill="#df9da3" stroke="#111" stroke-width="2"/>
  <text x="835" y="1178" class="tiny">numeric tensor boundary</text>
  <rect x="1115" y="1160" width="34" height="20" fill="#cfe7d5" stroke="#111" stroke-width="2"/>
  <text x="1160" y="1178" class="tiny">nonlinear / transform / quantization</text>
  <rect x="1595" y="1160" width="34" height="20" fill="#fff4df" stroke="#111" stroke-width="2"/>
  <text x="1640" y="1178" class="tiny">finalize / pure repack</text>
</svg>
